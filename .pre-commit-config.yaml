repos:
  - repo: local
    hooks:
      - id: poetry-task-format
        name: Format with Taskipy (black + isort)
        entry: poetry run task format
        language: system
        types: [python]

      - id: poetry-flake8
        name: Lint with Flake8
        entry: poetry run flake8
        language: system
        types: [python]

